# Repo-level "Automated security fixes" opens security PRs automatically.
# This file: sets cadence and disables routine version bumps.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0  # security PRs only — no routine bumps

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # the server image's base, pinned by digest
  - package-ecosystem: "docker"
    directory: "/packages/insomnium-server"
    schedule:
      interval: "monthly"
