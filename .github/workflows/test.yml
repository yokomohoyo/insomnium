name: Test

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

# `push` is limited to main: PR branches are covered by the `pull_request`
# event, so they run once instead of twice. Concurrency then only has to
# cancel runs superseded by a newer commit on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Lint markdown
      #   run: npm run lint:markdown
      
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type checks
        run: npm run type-check

      - name: Test Insomnium
        working-directory: packages/insomnia
        run: npm test
        if: always() # Run this even if the previous step already failed the run

      - name: Test Insomnium Testing
        working-directory: packages/insomnia-testing
        run: npm test
        if: always() # Run this even if the previous step already failed the run

  Smoke:
    # End-to-end smoke: build the renderer + main bundles, launch electron, fire
    # one HTTP request through the native libcurl binding, assert 200 OK.
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build app
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-build

      - name: Smoke test (electron + libcurl round-trip)
        run: node scripts/verify-smoke.mjs
        env:
          BUNDLE: build

  E2E:
    # Playwright UI tests against the built app. Not a required check yet: most
    # specs predate the current UI (the app opens in My Collection now) and are
    # brought back one at a time, so only the ones listed here run.
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      - name: Build app
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-build

      - name: Playwright
        working-directory: packages/insomnia-smoke-test
        run: npx playwright test --project=Smoke tests/smoke/event-stream.test.ts tests/smoke/quick-switcher.test.ts
        env:
          BUNDLE: build

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_number }}
          path: packages/insomnia-smoke-test/traces
          retention-days: 7

  Server:
    # The headless MCP server image (packages/insomnium-server): build it, run
    # it against a local echo server, and drive it over MCP. Not required yet.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Build image
        run: docker build -f packages/insomnium-server/Dockerfile -t insomnium-server:ci .

      - name: Smoke test
        run: node packages/insomnium-server/test/smoke.mjs --image insomnium-server:ci

  Package:
    # Catches electron-builder/native-dep regressions before they hit a release
    # branch. macOS only — windows/linux artifacts still build on release/**.
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install packages
        run: npm ci

      - name: Package app
        run: NODE_OPTIONS='--max_old_space_size=6144' npm run app-package

      - name: Upload dmg/zip
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: macos-package-${{ github.run_number }}
          path: |
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
          retention-days: 7
