name: APT Repository

# Publishes a signed APT repository to GitHub Pages so installed .deb packages
# can be upgraded with `apt upgrade` instead of a manual re-download.
#
# The .deb files themselves are NOT committed to git — they are pulled from
# GitHub Release assets each run and deployed as a Pages artifact.
#
# Required secrets, in the github-pages environment (only main deploys there):
#   APT_GPG_PRIVATE_KEY  ASCII-armoured private key used to sign the release index
#   APT_GPG_PASSPHRASE   passphrase for that key (set to an empty secret if none)
#
# See docs/apt-repository.md for one-time setup.

# Triggered by workflow_run rather than `release: published`, for two reasons:
# a workflow_run event runs in the DEFAULT BRANCH's context, which is what the
# github-pages environment's protection rule requires (a release event runs in
# the tag's context and is rejected outright); and it starts only once Release
# On Publish has finished uploading the .deb, instead of racing it.
on:
  workflow_run:
    workflows: ["Release On Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      keep:
        description: Number of most recent releases to keep in the pool
        required: false
        default: "5"

concurrency:
  group: apt-repo
  cancel-in-progress: false

# Pages is deployed from a workflow ARTIFACT, not a gh-pages branch. That is
# deliberate: a branch would have to carry the .deb files through `git push`,
# and at ~120 MB each they exceed GitHub's hard 100 MB per-file limit. The
# artifact path has no per-file limit (the ~1 GB published-site limit still
# applies — see the pool sizing note below).
permissions:
  contents: read
  pages: write
  id-token: write
  # to see that the site artifact is listed before it's deployed
  actions: read

jobs:
  publish:
    # Skip when the triggering build failed, or wasn't started by publishing a
    # release (a manual re-run or dry run); a manual dispatch always runs.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends apt-utils gnupg

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is not set. See docs/apt-repository.md."
            exit 1
          fi
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Download .deb assets from recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ github.event.inputs.keep || '5' }}
        run: |
          mkdir -p _site/apt/pool/main/i/insomnium
          # Newest-first; limit generously then trim, since not every release
          # necessarily carries a .deb asset.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft | not) | .tagName' > tags.txt

          downloaded=0
          while read -r tag; do
            [ "$downloaded" -ge "$KEEP" ] && break
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.deb' --dir _site/apt/pool/main/i/insomnium --clobber 2>/dev/null; then
              downloaded=$((downloaded + 1))
              echo "included $tag"
            else
              echo "skipped $tag (no .deb asset)"
            fi
          done < tags.txt

          if [ "$downloaded" -eq 0 ]; then
            echo "::error::No .deb assets found in any release; nothing to publish."
            exit 1
          fi
          echo "pooled $downloaded release(s)"
          du -sh _site/apt/pool

      - name: Build and sign repository index
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          cd _site/apt
          mkdir -p dists/stable/main/binary-amd64

          # NOTE: no --arch here. apt-ftparchive's --arch filter matches nothing
          # for these files and silently emits an empty index; the architecture
          # is constrained by the Release Architectures field instead.
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k -f dists/stable/main/binary-amd64/Packages

          # Release is written outside dists/stable and then moved in. `release`
          # hashes every file named Release in the tree it scans, and redirecting
          # straight to dists/stable/Release creates that file (with the header
          # already flushed) before the scan, so Release listed itself with a
          # stale hash.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Insomnium \
            -o APT::FTPArchive::Release::Label=Insomnium \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release

          # InRelease (inline-signed) is what modern apt prefers; Release.gpg is
          # kept for older clients. Both are signed from the final Release. The
          # passphrase arrives through env: an inline secrets expression would
          # be pasted into this script, where the shell expands any $, ` or " in it.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --local-user "$APT_GPG_KEY_ID" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$APT_GPG_PASSPHRASE" \
            --local-user "$APT_GPG_KEY_ID" \
            -abs -o dists/stable/Release.gpg dists/stable/Release

          # Public key served for humans following the manual install docs.
          gpg --export "$APT_GPG_KEY_ID" > insomnium-archive-keyring.gpg

      - name: Verify the index is readable and signed
        run: |
          cd _site/apt
          gpg --verify dists/stable/InRelease
          gpg --verify dists/stable/Release.gpg dists/stable/Release
          # Every file Release lists must match the hash it records. This also
          # fails a Release that lists itself, since no file can hold its own hash.
          awk '/^SHA256:$/ {p=1; next} /^[^ ]/ {p=0} p {print $1 "  " $3}' dists/stable/Release \
            | (cd dists/stable && sha256sum --strict --check)
          grep -q '^Package: insomnium$' dists/stable/main/binary-amd64/Packages
          echo "versions published:"
          awk '/^Package: insomnium$/{p=1} p&&/^Version:/{print "  " $2; p=0}' \
            dists/stable/main/binary-amd64/Packages

      - name: Check the payload fits the published-site limit
        run: |
          BYTES=$(du -sb _site | cut -f1)
          MB=$((BYTES / 1024 / 1024))
          echo "site payload: ${MB} MB"
          # GitHub's published-site limit is ~1 GB. Warn well before it so a
          # future `keep` bump does not fail at deploy time.
          if [ "$MB" -gt 900 ]; then
            echo "::error::Site payload ${MB} MB is at or over the ~1 GB published-site limit. Lower the 'keep' input."
            exit 1
          elif [ "$MB" -gt 700 ]; then
            echo "::warning::Site payload ${MB} MB is approaching the ~1 GB published-site limit."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # The deploy looks the artifact up by name, and GitHub's listing of a
      # just-uploaded artifact isn't the same from one request to the next for
      # a while: 0.10.0 found none twice, and on 0.11.0 a check a second before
      # the deploy saw it listed and the deploy still found none. So the
      # listing has to hold, several times running, before the deploy; and the
      # deploy itself is tried up to three times. Rerunning the job is no way
      # out, since it uploads a second artifact and the deploy refuses two.
      - name: Wait for the site artifact to be listed, and to stay listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=0
          for attempt in $(seq 1 60); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq .total_count || echo 0)
            if [ "$count" = "1" ]; then
              seen=$((seen + 1))
              echo "Listed, $seen running (attempt $attempt)."
              if [ "$seen" -ge 6 ]; then
                exit 0
              fi
            else
              seen=0
              echo "Listed: ${count:-0}. Waiting (attempt $attempt of 60)."
            fi
            sleep 5
          done
          echo "::error::The site artifact was not listed six times running within 5 minutes."
          exit 1

      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before a second try
        if: steps.first.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (second try)
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before a third try
        if: steps.second.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (third try)
        id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # the page's address, from whichever try deployed it
      - name: Deployed
        id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}" >> "$GITHUB_OUTPUT"
