name: Release Build

# Builds the installers for all 3 OSes and attaches them, with their sums and
# provenance attestations, to a draft release. Published releases are
# immutable, so every asset goes on the draft first and a maintainer then
# publishes it (docs/releasing.md):
#
#   gh release create X.Y.Z --draft --target <full SHA on main> --title X.Y.Z ...
#   gh workflow run release-build.yml --ref main -f tag=X.Y.Z
#   gh release edit X.Y.Z --draft=false      # once this run has passed
#
# Publishing starts Release On Publish, which checks the assets; the APT,
# Homebrew, AUR and npm workflows follow it. A dry run builds the draft's
# commit, or any commit given by its full SHA, unsigned, and uploads nothing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The draft release's tag (for a dry run, a commit's full SHA will do)
        required: true
        type: string
      dry_run:
        description: Build unsigned and upload nothing
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only a token that can push sees draft releases
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - name: Find the draft and its commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" && "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::That isn't a release tag's name (or, for a dry run, a commit's full SHA)"
            exit 1
          fi
          release=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\")")
          if [ -z "$release" ]; then
            echo "::error::No release has the tag $TAG; create it with gh release create --draft"
            exit 1
          fi
          if [ "$(jq -r .draft <<<"$release")" != true ]; then
            echo "::error::$TAG is already published, and a published release's assets can't change"
            exit 1
          fi
          # a commit, not a branch that can move while this runs
          sha=$(jq -r .target_commitish <<<"$release")
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The draft's target is '$sha'; create it with --target <the commit's full SHA>"
            exit 1
          fi
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::$sha isn't on main ($status)"
            exit 1
          fi
          # publishing tags the draft's target, or keeps a tag that's already there
          if existing=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$sha" ]; then
              echo "::error::The tag $TAG already exists, at $existing, not $sha"
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # required to upload assets to the release
      # a build provenance attestation for each release asset
      id-token: write
      attestations: write
    # the macOS build's Apple certificate and notarization key live in
    # apple-signing, which only runs started from main may use
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            environment: apple-signing
          - os: windows-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout the draft's commit
        uses: actions/checkout@v7
        with:
          # the commit resolve checked is on main, whichever ref the run was
          # started from
          ref: ${{ needs.resolve.outputs.sha }}
          # this job holds the signing secrets: no git credentials left in
          # .git/config for a build script to find
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # no dependency's install script runs in the job that later holds the
      # signing secrets; only those the build needs, by name: node-libcurl's
      # fetches its prebuilt binary, electron-winstaller's picks its 7-Zip
      - name: Install packages
        run: |
          npm ci --ignore-scripts
          npm rebuild @getinsomnia/node-libcurl electron-winstaller
          # the binary node-libcurl downloaded is the one pinned
          npm run verify:libcurl --workspace=packages/insomnia

      # electron-builder.config.js notarizes only when APPLE_API_KEY (a path to
      # the App Store Connect .p8 key) is set, so decode it to a file first.
      # a dry run can build any commit, so it never gets the signing secrets
      - name: Prepare notarization API key (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "::warning::APPLE_API_KEY_BASE64 is not set; the app will be signed but not notarized."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package app (macOS, unsigned dry run)
        if: matrix.os == 'macos-latest' && inputs.dry_run
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package app (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
          # Developer ID Application certificate + key, as a base64-encoded .p12.
          CSC_LINK: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        run: |
          app=packages/insomnia/dist/mac-arm64/Insomnium.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime Version|Timestamp)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Package app (Windows / Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"

      # A separate pass, after the other Linux targets: the snap target deletes
      # chrome-sandbox from linux-unpacked (see electron-builder.config.js).
      - name: Package snap (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npm run package:snap --workspace=packages/insomnia

      - name: List built artifacts
        shell: bash
        run: ls -lh packages/insomnia/dist/ || true

      # Upload one set of build outputs as a workflow artifact too — handy for
      # debugging when the release-upload step fails.
      - name: Upload workflow artifacts (debug copy)
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: ${{ matrix.os }}-dist-${{ github.run_number }}
          retention-days: 14
          path: |
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/squirrel-windows/*.exe
            packages/insomnia/dist/squirrel-windows/*.nupkg
            packages/insomnia/dist/squirrel-windows/RELEASES
            packages/insomnia/dist/*.snap
            packages/insomnia/dist/*.rpm
            packages/insomnia/dist/*.deb
            packages/insomnia/dist/*.AppImage
            packages/insomnia/dist/*.tar.gz

      # what was built here, from this commit: `gh attestation verify <file>
      # --repo yokomohoyo/insomnium` checks a download
      - name: Attest the release assets
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/squirrel-windows/*.exe
            packages/insomnia/dist/squirrel-windows/*.nupkg
            packages/insomnia/dist/*.snap
            packages/insomnia/dist/*.rpm
            packages/insomnia/dist/*.deb
            packages/insomnia/dist/*.AppImage
            packages/insomnia/dist/*.tar.gz

      - name: Attach assets to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/squirrel-windows/*.exe
            packages/insomnia/dist/squirrel-windows/*.nupkg
            packages/insomnia/dist/*.snap
            packages/insomnia/dist/*.rpm
            packages/insomnia/dist/*.deb
            packages/insomnia/dist/*.AppImage
            packages/insomnia/dist/*.tar.gz
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No artifacts found to upload for ${{ matrix.os }}"
            exit 0
          fi
          # their SHA-256 sums, by name, one file for each OS's
          sums="$RUNNER_TEMP/SHA256SUMS-${OS%-latest}.txt"
          for f in "${files[@]}"; do
            if command -v sha256sum >/dev/null; then sum=$(sha256sum "$f"); else sum=$(shasum -a 256 "$f"); fi
            echo "${sum%% *}  $(basename "$f")"
          done > "$sums"
          cat "$sums"
          echo "Uploading ${#files[@]} files to the draft $TAG:"
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" "$sums" --repo "${{ github.repository }}" --clobber

  ready:
    needs: [resolve, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # only a token that can push sees draft releases
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          bash .github/scripts/check-release-assets.sh "$TAG"
          {
            echo "### $TAG is ready to publish"
            echo
            echo "Look over the draft, then publish it (the assets can't change after that):"
            echo
            echo '```'
            echo "gh release edit $TAG --repo ${{ github.repository }} --draft=false"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
