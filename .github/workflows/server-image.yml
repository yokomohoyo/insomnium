name: Server Image

# Builds the headless MCP server image (packages/insomnium-server), smoke-tests
# it, and pushes it to ghcr.io/<owner>/insomnium-server when a release is
# published: tagged with the version, plus latest for a full release. Only the
# docker CLI and GITHUB_TOKEN are used, no third-party actions or secrets.
#
# By hand: give a release tag to (re)publish it, or turn push off to build and
# test any ref.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build (any ref when push is off)
        required: true
        type: string
      push:
        description: Push to GHCR
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/insomnium-server
      REF: ${{ github.event.release.tag_name || inputs.ref }}
      PUSH: ${{ github.event_name == 'release' || inputs.push }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - name: Check the ref
        run: |
          if [ "$PUSH" = "true" ] && ! [[ "$REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Only a version tag can be pushed, not '$REF'"
            exit 1
          fi
          # a tag for the image: the version, or the ref made safe
          echo "TAG=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Build
        run: |
          docker build -f packages/insomnium-server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$REF" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=Headless Insomnium MCP server" \
            -t "$IMAGE:$TAG" .

      - name: Smoke test
        run: node packages/insomnium-server/test/smoke.mjs --image "$IMAGE:$TAG"

      - name: Push
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$TAG"
          if [ "$PRERELEASE" != "true" ] && [[ "$TAG" != *-* ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          docker logout ghcr.io
