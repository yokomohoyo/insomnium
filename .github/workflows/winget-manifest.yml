name: winget Manifest

# Writes the three winget manifest files for a published release, from its
# Windows installer's URL and SHA-256, uploads them as an artifact, and then
# installs from them with winget on a Windows runner. It submits nothing: the
# files are for a pull request to microsoft/winget-pkgs, made by hand
# (docs/releasing.md). Run by hand only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to write a manifest for, e.g. 0.9.0"
        required: true

permissions:
  contents: read

env:
  PACKAGE_IDENTIFIER: yokomohoyo.Insomnium
  # as the installer writes them under Installed apps, which winget matches on
  PUBLISHER: yokomohoyo
  PACKAGE_NAME: Insomnium
  # the installer's key under Installed apps: electron-builder derives it from
  # the appId (com.insomnium.app), so it is the same in every version
  PRODUCT_CODE: 88eec264-f2f2-51fb-bf3d-c18bf0b21ee3
  # the schema winget-pkgs' pull request template asks for
  MANIFEST_VERSION: 1.28.0

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version like 0.9.0"
            exit 1
          fi
          asset="Insomnium.Core-$TAG.exe"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$(jq -r .draft <<<"$release")" != false ]; then
            echo "::error::$TAG is not published"
            exit 1
          fi
          digest=$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .digest // ""' <<<"$release")
          url=$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release")
          if [[ "$digest" != sha256:* ]]; then
            echo "::error::$asset is not on the release $TAG, or has no SHA-256 digest"
            exit 1
          fi
          sha=$(tr '[:lower:]' '[:upper:]' <<<"${digest#sha256:}")
          date=$(jq -r '.published_at[0:10]' <<<"$release")

          # manifests/<first letter>/<publisher>/<package>/<version>/
          id=$PACKAGE_IDENTIFIER
          dir="manifests/$(tr '[:upper:]' '[:lower:]' <<<"${id:0:1}")/${id%%.*}/${id#*.}/$TAG"
          mkdir -p "$dir"

          cat > "$dir/$id.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.$MANIFEST_VERSION.schema.json

          PackageIdentifier: $id
          PackageVersion: $TAG
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: $MANIFEST_VERSION
          EOF

          # An NSIS installer: winget passes /S itself. It installs for the
          # current user unless /allusers is given.
          cat > "$dir/$id.installer.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.$MANIFEST_VERSION.schema.json

          PackageIdentifier: $id
          PackageVersion: $TAG
          InstallerType: nullsoft
          InstallModes:
          - interactive
          - silent
          UpgradeBehavior: install
          ProductCode: $PRODUCT_CODE
          ReleaseDate: $date
          Installers:
          - Architecture: x64
            Scope: user
            InstallerUrl: $url
            InstallerSha256: $sha
            InstallerSwitches:
              Custom: /currentuser
          - Architecture: x64
            Scope: machine
            InstallerUrl: $url
            InstallerSha256: $sha
            InstallerSwitches:
              Custom: /allusers
            ElevationRequirement: elevationRequired
          ManifestType: installer
          ManifestVersion: $MANIFEST_VERSION
          EOF

          cat > "$dir/$id.locale.en-US.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.$MANIFEST_VERSION.schema.json

          PackageIdentifier: $id
          PackageVersion: $TAG
          PackageLocale: en-US
          Publisher: $PUBLISHER
          PublisherUrl: https://github.com/yokomohoyo
          PublisherSupportUrl: https://github.com/$GITHUB_REPOSITORY/issues
          PackageName: $PACKAGE_NAME
          PackageUrl: https://github.com/$GITHUB_REPOSITORY
          License: MIT
          LicenseUrl: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/LICENSE
          ShortDescription: A local, privacy-focused API client for HTTP, GraphQL, gRPC, WebSocket and more.
          Moniker: insomnium
          Tags:
          - api
          - api-client
          - graphql
          - grpc
          - http
          - rest
          - websocket
          ReleaseNotesUrl: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG
          ManifestType: defaultLocale
          ManifestVersion: $MANIFEST_VERSION
          EOF

          for f in "$dir"/*.yaml; do echo "--- $f"; cat "$f"; done

      - name: Upload the manifest
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifest-${{ inputs.tag }}
          path: manifests
          if-no-files-found: error

  # Installs from the manifest with winget on a clean Windows machine, for this
  # user and then for everyone, and checks what winget-pkgs' own validation
  # looks at: the entry the installer leaves under Installed apps.
  test:
    needs: manifest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winget-manifest-${{ inputs.tag }}
          path: manifests

      - name: Install and uninstall with winget
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Get-ChildItem -Recurse -Directory manifests | Where-Object Name -eq $env:TAG).FullName
          function Invoke-Winget {
            Write-Host "> winget $($args -join ' ')"
            $process = Start-Process winget -ArgumentList $args -NoNewWindow -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit(300000)) {
              Write-Host "::error::winget $($args[0]) did not finish in 5 minutes"
              Get-CimInstance Win32_Process |
                Where-Object { "$($_.Name) $($_.CommandLine)" -match 'Insomnium|winget|WindowsPackageManager|Un_|nsis' } |
                ForEach-Object { Write-Host "  $($_.ProcessId) (parent $($_.ParentProcessId)) $($_.Name): $($_.CommandLine)" }
              throw "winget $($args[0]) hung"
            }
            if ($process.ExitCode -ne 0) { throw "winget $($args[0]) exited $($process.ExitCode)" }
          }
          $script:failed = 0
          function Check($ok, $what) {
            if ($ok) { Write-Host "ok    $what" } else { Write-Host "::error::$what"; $script:failed++ }
          }
          function Wait-Gone($path) {
            # the uninstaller hands over to a copy of itself and returns early
            foreach ($i in 1..60) { if (-not (Test-Path $path)) { return $true }; Start-Sleep 1 }
            $false
          }

          # the runner's winget is too old to know the manifest schema
          Invoke-Winget --version
          Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser
          Repair-WinGetPackageManager -Latest -Force
          Invoke-Winget --version
          Invoke-Winget validate --manifest $dir
          Invoke-Winget settings --enable LocalManifestFiles

          $uninstall = 'Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $scopes = @(
            @{ name = 'user'; key = "HKCU:\$uninstall\$env:PRODUCT_CODE"; exe = "$env:LOCALAPPDATA\Programs\Insomnium\Insomnium.exe" },
            @{ name = 'machine'; key = "HKLM:\$uninstall\$env:PRODUCT_CODE"; exe = "$env:ProgramFiles\Insomnium\Insomnium.exe" }
          )
          foreach ($scope in $scopes) {
            $name = $scope.name
            Write-Host "=== scope $name"
            Invoke-Winget install --manifest $dir --scope $name --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

            Check (Test-Path $scope.exe) "$name scope: $($scope.exe) exists"
            $entry = Get-ItemProperty $scope.key -ErrorAction SilentlyContinue
            Check ($null -ne $entry) "$name scope: Installed apps key $($scope.key)"
            Check ($entry.DisplayName -eq $env:PACKAGE_NAME) "$name scope: DisplayName '$($entry.DisplayName)' is '$env:PACKAGE_NAME'"
            Check ($entry.Publisher -eq $env:PUBLISHER) "$name scope: Publisher '$($entry.Publisher)' is '$env:PUBLISHER'"
            Check ($entry.DisplayVersion -eq $env:TAG) "$name scope: DisplayVersion '$($entry.DisplayVersion)' is '$env:TAG'"
            $version = (Get-Item $scope.exe -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
            Check ("$version".StartsWith($env:TAG)) "$name scope: Insomnium.exe is version '$version'"

            Invoke-Winget uninstall --manifest $dir --silent --disable-interactivity
            Check (Wait-Gone $scope.exe) "$name scope: Insomnium.exe is gone after uninstall"
            Check (Wait-Gone $scope.key) "$name scope: Installed apps key is gone after uninstall"
          }

          if ($script:failed) { throw "$($script:failed) check(s) failed" }
          Write-Host 'All checks passed'
