name: Release On Publish

# Fires when a GitHub Release is published (via the UI or `gh release create`),
# builds installers/packages for all 3 OSes, and uploads them as assets to that
# release. Also supports manual re-runs via workflow_dispatch with an existing
# tag name.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to (re)build artifacts for
        required: true
        type: string
      dry_run:
        description: Build but don't upload anything to the release
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write  # required to upload assets to the release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # the Windows build signs through SignPath Foundation: the environment has
    # the SignPath project's names and the CI user's API token (only release
    # tags and main deploy there)
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
            environment: windows-signing
          - os: ubuntu-latest

    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # a dry run (unsigned on every OS, uploading nothing) can build a commit; a release only a tag
          if [[ "$DRY_RUN" == "true" && "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::That isn't a release tag's name (or, for a dry run, a commit's full SHA)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          # a tag: a branch or a pull request's head isn't built (and signed) as
          # a release, whichever ref the run was started from
          ref: ${{ steps.tag.outputs.ref }}
          # this job holds the signing secrets: no git credentials left in
          # .git/config for a build script to find
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # no dependency's install script runs in the job that later holds the
      # signing secrets; only those the build needs, by name: node-libcurl's
      # fetches its prebuilt binary, electron-winstaller's picks its 7-Zip
      - name: Install packages
        run: |
          npm ci --ignore-scripts
          npm rebuild @getinsomnia/node-libcurl electron-winstaller

      # electron-builder.config.js notarizes only when APPLE_API_KEY (a path to
      # the App Store Connect .p8 key) is set, so decode it to a file first.
      # a dry run can build any commit, so it never gets the signing secrets
      - name: Prepare notarization API key (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "::warning::APPLE_API_KEY_BASE64 is not set; the app will be signed but not notarized."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package app (macOS, unsigned dry run)
        if: matrix.os == 'macos-latest' && inputs.dry_run
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package app (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
          # Developer ID Application certificate + key, as a base64-encoded .p12.
          CSC_LINK: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signature and notarization (macOS)
        if: matrix.os == 'macos-latest' && !inputs.dry_run
        shell: bash
        run: |
          app=packages/insomnia/dist/mac-arm64/Insomnium.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime Version|Timestamp)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Package app (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npm run app-package
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"

      # Windows signing goes through SignPath Foundation, and is on once the
      # environment has the SignPath project (SIGNPATH_* variables, and the
      # SIGNPATH_API_TOKEN secret). Until then Windows builds stay unsigned but
      # take the same path.
      - name: Decide on signing (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        # a dry run isn't signed: it can build a commit that isn't a release
        run: echo "SIGN_WINDOWS=${{ vars.SIGNPATH_ORGANIZATION_ID != '' && !inputs.dry_run }}" >> "$GITHUB_ENV"

      # Windows packages in two passes so Insomnium.exe can be signed before the
      # installers embed it: electron-builder rewrites the exe's asar-integrity
      # resource while packing, so it can only be signed after `--dir`, and the
      # Squirrel installer and portable exe are then built from that signed
      # copy with `--prepackaged`. The installers are signed in a second
      # request afterwards. Each request waits for a maintainer's approval.
      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npm run build:app --workspace=packages/insomnia
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"

      - name: Package unpacked app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: packages/insomnia
        run: npx electron-builder build --win --dir --config electron-builder.config.js --publish never
        env:
          USE_HARD_LINKS: "false"

      - name: Upload app exe for signing (Windows)
        id: unsigned-app
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-exe-${{ github.run_number }}
          path: packages/insomnia/dist/win-unpacked/Insomnium.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign app exe (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        # v2
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/app

      - name: Swap in signed app exe (Windows)
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/app/Insomnium.exe
          if ($sig.Status -ne 'Valid') { throw "Signed Insomnium.exe is $($sig.Status): $($sig.StatusMessage)" }
          Copy-Item signed/app/Insomnium.exe packages/insomnia/dist/win-unpacked/Insomnium.exe -Force

      - name: Build installers from the unpacked app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: packages/insomnia
        run: npx electron-builder build --win --prepackaged dist/win-unpacked --config electron-builder.config.js --publish never
        env:
          USE_HARD_LINKS: "false"

      - name: Check the installer carries the app exe unchanged (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $want = (Get-FileHash packages/insomnia/dist/win-unpacked/Insomnium.exe).Hash
          $nupkg = Get-ChildItem packages/insomnia/dist/squirrel-windows/*-full.nupkg | Select-Object -First 1
          $zip = [IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -like 'lib/*/Insomnium.exe' } | Select-Object -First 1
            if (-not $entry) { throw "Insomnium.exe not found in $($nupkg.Name)" }
            $tmp = New-TemporaryFile
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp.FullName, $true)
          } finally { $zip.Dispose() }
          $got = (Get-FileHash $tmp.FullName).Hash
          if ($got -ne $want) { throw "Insomnium.exe in $($nupkg.Name) ($got) differs from win-unpacked ($want)" }
          "Insomnium.exe in $($nupkg.Name) matches win-unpacked ($want)"

      - name: Stage installers for signing (Windows)
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          mkdir -p to-sign
          cp packages/insomnia/dist/squirrel-windows/*.exe packages/insomnia/dist/*-portable.exe to-sign/
          ls -l to-sign

      - name: Upload installers for signing (Windows)
        id: unsigned-installers
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers-${{ github.run_number }}
          path: to-sign/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        # v2
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installers

      - name: Swap in signed installers (Windows)
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          for f in signed/installers/*.exe; do
            name=$(basename "$f")
            if [[ "$name" == *-portable.exe ]]; then
              cp -f "$f" "packages/insomnia/dist/$name"
            else
              cp -f "$f" "packages/insomnia/dist/squirrel-windows/$name"
            fi
          done

      - name: Report Authenticode signatures (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $files = @(Get-Item packages/insomnia/dist/win-unpacked/Insomnium.exe) +
                   @(Get-ChildItem packages/insomnia/dist/squirrel-windows/*.exe) +
                   @(Get-ChildItem packages/insomnia/dist/*-portable.exe)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0,-12} {1}  {2}" -f $sig.Status, $f.Name, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($env:SIGN_WINDOWS -eq 'true' -and $bad -gt 0) { throw "$bad Windows executable(s) are not validly signed" }

      # A separate pass, after the other Linux targets: the snap target deletes
      # chrome-sandbox from linux-unpacked (see electron-builder.config.js).
      - name: Package snap (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npm run package:snap --workspace=packages/insomnia

      - name: List built artifacts
        shell: bash
        run: ls -lh packages/insomnia/dist/ || true

      # Upload one set of build outputs as a workflow artifact too — handy for
      # debugging when the release-upload step fails.
      - name: Upload workflow artifacts (debug copy)
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: ${{ matrix.os }}-dist-${{ github.run_number }}
          retention-days: 14
          path: |
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/squirrel-windows/*.exe
            packages/insomnia/dist/squirrel-windows/*.nupkg
            packages/insomnia/dist/squirrel-windows/RELEASES
            packages/insomnia/dist/*.snap
            packages/insomnia/dist/*.rpm
            packages/insomnia/dist/*.deb
            packages/insomnia/dist/*.AppImage
            packages/insomnia/dist/*.tar.gz

      - name: Attach assets to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            packages/insomnia/dist/*.dmg
            packages/insomnia/dist/*.zip
            packages/insomnia/dist/*.exe
            packages/insomnia/dist/squirrel-windows/*.exe
            packages/insomnia/dist/squirrel-windows/*.nupkg
            packages/insomnia/dist/*.snap
            packages/insomnia/dist/*.rpm
            packages/insomnia/dist/*.deb
            packages/insomnia/dist/*.AppImage
            packages/insomnia/dist/*.tar.gz
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No artifacts found to upload for ${{ matrix.os }}"
            exit 0
          fi
          echo "Uploading ${#files[@]} files to release $TAG:"
          printf '  %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "${{ github.repository }}" --clobber

      # SignPath Foundation's terms: once Windows builds are signed through it,
      # the release page names the code signing policy (once, from one build),
      # which the README has then
      - name: Link the code signing policy from the release
        if: ${{ !inputs.dry_run && matrix.os == 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Code signing policy' README.md || exit 0
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          case "$body" in *"Code signing policy"*) exit 0 ;; esac
          printf '%s\n\n[Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)\n' "$body" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file "$RUNNER_TEMP/notes.md"
