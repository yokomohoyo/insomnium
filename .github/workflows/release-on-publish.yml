name: Release On Publish

# Fires when a release is published, after Release Build put its assets on the
# draft (docs/releasing.md), and checks them again: their sums, digests and
# attestations. The APT, Homebrew, AUR and npm workflows run once this passes,
# and wait for it by this name.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/check-release-assets.sh "$TAG"
